<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>tung</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.video-container {
    position: relative;
    aspect-ratio: 16 / 9;
    background: black;
    overflow: hidden;
    border-radius: 12px;
}

.video-container iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
}

.controls {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
}

button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #ff0000;
    color: white;
    font-weight: bold;
}

button:hover {
    background: #cc0000;
}

.error {
    color: #ff6666;
    margin-top: 10px;
}
</style>
</head>
<body>

<div class="container">

    <h1>Video Player</h1>

    <div class="controls">
        <input
            id="videoInput"
            placeholder="Enter YouTube Video ID"
            value="https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        >

        <button onclick="loadVideo()">
            Play
        </button>
    </div>

    <div id="error" class="error"></div>

    <div class="video-container">
        <iframe
            id="player"
            allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
    </div>
    
  <h2>Save urls</h2>

  <input id="todoInput" placeholder="Enter a URL" />
  <button onclick="addTodo()">Add</button>

  <ul id="list"></ul>


</div>

<script>
 let todos = JSON.parse(localStorage.getItem("todos")) || [];

    renderTodos();

    function addTodo() {
      const input = document.getElementById("todoInput");
      const text = input.value.trim();

      if (!text) return;
     

      todos.push(text);

      localStorage.setItem("todos", JSON.stringify(todos));

      input.value = "";
      renderTodos();
    }

    function renderTodos() {
      const list = document.getElementById("list");
      list.innerHTML = "";

      todos.forEach((todo, index) => {
        const li = document.createElement("li");

        li.textContent = todo;

        // delete button
        const btn = document.createElement("button");
        btn.textContent = "X";
        btn.style.marginLeft = "10px";

        btn.onclick = () => {
          todos.splice(index, 1);
          localStorage.setItem("todos", JSON.stringify(todos));
          renderTodos();
        };

        li.appendChild(btn);
        list.appendChild(li);
      });
    }
    
    
let streamUrl = "";
const sheetId =
"1dily2wiik92TAyK3zyIsu8TDuyYNoF20IM1iMk_X-pg";

const sheetName =
"Youtube-education-parameter";

const range = "A1";

let cachedParams = null;
let cachedAt = 0;

async function fetchParamsFromSheet() {
  const now = Date.now();

  if (cachedParams && now - cachedAt < 3600000) {
    return cachedParams;
  }

  const url =
    `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetName}&range=${range}`;

  try {
    const res = await fetch(url);
    const text = await res.text();

    
    const match = text.match(/setResponse\((.*)\);/s);

    if (!match) {
      console.warn("Unexpected sheet response:", text);
      return null;
    }

    const data = JSON.parse(match[1]);

    const params = data?.table?.rows?.[0]?.c?.[0]?.v;

    if (!params) {
      console.warn("No params found");
      return null;
    }

    cachedParams = params;
    cachedAt = now;

    return params;

  } catch (err) {
    console.warn("fetch failed:", err);
    return null;
  }
}

async function loadVideo() {

    const errorEl =
        document.getElementById("error");

    errorEl.textContent = "";

    const videoId =
        document.getElementById("videoInput")
        .value
        .trim()
        .slice(32,43);

    if (!videoId) {
        errorEl.textContent =
            "Please enter a video Url";
        return;
    }

    try {

        const params =
            await fetchParamsFromSheet();

        const streamUrl =
            `https://www.youtubeeducation.com/embed/${videoId}${params || ""}`;

        document.getElementById("player")
            .src = streamUrl;

    } catch (err) {

        console.error(err);

        errorEl.textContent =
            "Failed to load video";
    }
}

loadVideo();

</script>

</body>
</html>
